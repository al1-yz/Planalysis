[package]
name = "planalysis"
version = "0.1.0"
description = "Planalysis desktop application"
authors = ["AlissonCoding"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "planalysis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[lints.clippy]
unwrap_used = "deny"
